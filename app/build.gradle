plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace "com.androidinnovations.photosview"
    compileSdk 36

    defaultConfig {
        applicationId "com.androidinnovations.photospick"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.3"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding = true
        // for view binding
        viewBinding = true
        buildConfig = true
    }
    packagingOptions {
        resources {
            excludes += [
                    "**/dump_syms/**",
                    "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            ]
        }
        jniLibs {
            useLegacyPackaging false
        }
    }
    dexOptions {
        javaMaxHeapSize "4g" //specify the heap size for the dex process
    }


}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
//ViewModel and livedata
    def lifecycle_version = '2.9.4'
    //implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    implementation 'com.squareup.retrofit2:converter-moshi:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    //Glide
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    kapt 'com.github.bumptech.glide:compiler:5.0.5'

    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    //  implementation 'io.github.luizgrp.sectionedrecyclerviewadapter:sectionedrecyclerviewadapter:v3.2.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.2.1' //glide
    implementation('com.github.bumptech.glide:okhttp3-integration:5.0.5') { //glide
        exclude group: 'glide-parent'
    }
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'//gif drawable

    //Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.3.6'
    implementation 'com.google.android.gms:play-services-ads:24.7.0' // play services

    //implementation("org.conscrypt:conscrypt-android:2.5.2")//for ssl
    implementation ("org.bouncycastle:bcprov-jdk18on:1.78.1")
    implementation("androidx.cardview:cardview:1.0.0")

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1' // for android scheduler
    //zoom view
    implementation 'com.jsibbold:zoomage:1.3.1'
    //noinspection RiskyLibrary,PlaySdkIndexDeprecated
   // implementation 'com.google.android.play:core:1.10.3'

    implementation 'com.pixplicity.easyprefs:EasyPrefs:1.10.0'//SharedPreferance


}